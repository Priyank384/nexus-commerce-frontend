name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # .npmrc pins legacy-peer-deps; npm ci honours it.
      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # The build runs without API_BASE_URL: rewrites fall back to [] and no request is
      # made at build time, so CI does not need a live backend.
      - run: npm run build
