name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # .npmrc pins legacy-peer-deps; npm ci honours it.
      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # CI must not need a live backend, and this asserts it: no API_BASE_URL is set here, so a
      # route that reads the catalogue during prerender fails the build with
      # "API_BASE_URL is not set" rather than quietly baking a snapshot of the deployed store into
      # the artifact. Data-backed routes therefore await `connection()` (see src/lib/catalog/server)
      # and `rewrites()` falls back to [] with no origin to build a destination from.
      - run: npm run build
